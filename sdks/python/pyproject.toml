[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autophys"
version = "0.1.0"
description = "AI-guided calibration of physics simulators: fits, identifiability, experiment design, agent loop"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools.package-data]
autophys = ["playbooks/*/SKILL.md", "prices.json"]
