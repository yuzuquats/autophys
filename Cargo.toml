[package]
name = "autophys-cli"
description = "autophys daemon: a tento-web app; `autophys serve` serves html/routes on loopback"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "autophys_cli"
path = "src/lib.rs"

[[bin]]
name = "autophys"
path = "src/main.rs"

[dependencies]
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
autophys = { path = "sdks/rust" }
# The tento crates in vendor/tento: tento-web is the file-based router and
# bundler, tento-dirs the app dirs.
tento-web = { path = "vendor/tento/tento-web" }
tento-dirs = { path = "vendor/tento/tento-dirs" }
tento-sh = { path = "vendor/tento/tento-sh" }
# The same versions the vendored tento crates resolve to.
actix-web = "4.9.0"
anyhow = "1.0.94"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync"] }
# The record store (src/store, src/ingest.rs, src/http.rs; store.md).
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Password hashes for browser accounts (`serve --login`, src/accounts.rs).
argon2 = "0.5"
sha2 = "0.10.8"
toml = "0.8"
thiserror = "1.0.61"

[dev-dependencies]
actix-http = "3"
tempfile = "3"

# Replaces three crates.io packages, wherever they appear in the dependency
# graph, with the patched copies in vendor/tento/vendor.
[patch.crates-io]
fsevent-sys = { path = "vendor/tento/vendor/fsevent-sys" }
notify = { path = "vendor/tento/vendor/notify" }
iana-time-zone = { path = "vendor/tento/vendor/iana-time-zone" }

# This crate is its own workspace root, so a checkout nested under another
# Cargo workspace still builds. vendor/ is excluded: vendor/tento is a
# separate workspace for the vendored crates.
[workspace]
# The root is an implicit member; listing "." breaks nested vendor workspace inheritance.
members = ["sdks/rust"]
exclude = ["vendor"]
