# Hidden from every policy: the system the model must discover.
[truth]
R0 = 0.025
R1 = 0.045
C1 = 1600.0

# Per-seed truth (EX-4, autophys bench --truth drawn): each value is drawn
# from its range; the regime check keeps every case answer unchanged. The
# short-pulse answer (R1 not determined) is a noise-level threshold, so the
# ranges are narrow: wider ones flip it (autophys examples --check).
[prior]
R0 = { log_uniform = [0.022, 0.028] }
R1 = { log_uniform = [0.042, 0.05] }
C1 = { log_uniform = [1500.0, 1750.0] }

[noise]
sigma = { v = 0.002 }

[[test]]
name = "unseen_train"
kind = "pulse_train"
current = 1.5
on = 40.0
off = 60.0
duration = 500.0
rate = 1.0
capacity_ah = 2.5
soc0 = 0.9

[case.short-only]
combos = { R0 = { R0 = 1.0 }, C1 = { C1 = 1.0 } }
expected_non_identified = ["R1"]
note = "A 6 s pulse against a 72 s RC time constant resolves the instantaneous I R0 drop and initial I/C1 slope; R1 needs a longer polarization and relaxation trace."

[case.full]
combos = { R0 = { R0 = 1.0 }, R1 = { R1 = 1.0 }, C1 = { C1 = 1.0 } }
expected_non_identified = []
note = "A 6 s pulse against a 72 s RC time constant resolves the instantaneous I R0 drop and initial I/C1 slope; R1 needs a longer polarization and relaxation trace."

[case.biased]
bias = { v = 0.01 }
combos = { R0 = { R0 = 1.0 }, R1 = { R1 = 1.0 }, C1 = { C1 = 1.0 } }
expected_non_identified = []
note = "A 6 s pulse against a 72 s RC time constant resolves the instantaneous I R0 drop and initial I/C1 slope; R1 needs a longer polarization and relaxation trace."
