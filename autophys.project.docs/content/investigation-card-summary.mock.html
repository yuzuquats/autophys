<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigation summary in plain language</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--foreground,#252525);font:14px/1.6 var(--font-sans,system-ui,sans-serif)}
.controls{display:flex;flex-wrap:wrap;gap:4px;width:fit-content;padding:3px;border-radius:8px;background:var(--secondary,#eee);margin-bottom:12px}button{font:12px/1.4 inherit;color:inherit;cursor:pointer}.controls button{font:12px/1.4 var(--font-sans,system-ui,sans-serif);border:0;background:none;border-radius:5px;padding:7px 10px;color:var(--muted-foreground,#666)}.controls button[aria-pressed=true]{background:var(--card,#fff);color:var(--foreground,#222);box-shadow:0 1px 3px #00000016}
.note{font-size:12px;line-height:1.6;margin:0 0 22px;color:var(--muted-foreground,#666)}
.card{border-radius:12px;background:#fff;color:#252525;padding:24px;box-shadow:0 2px 5px #0000000f,0 8px 22px #00000012;min-width:0}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}h2{font-size:21px;font-weight:600;line-height:1.35;letter-spacing:-.018em;text-wrap:balance;margin:0}p{margin:0}.identity{font-size:12px;color:#666;margin-top:7px}.status{background:#edf4ee;color:#256046;font-size:11px;padding:4px 7px;line-height:1.5;border-radius:4px;flex:none}.pending{background:#fbf2e5;color:#845019}
.explanation{font-size:15px;line-height:1.75;margin:20px 0 24px;max-width:70ch}
.change{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:22px}.change>div+div{padding-left:24px;border-left:1px solid #e3e3e3}.change h3{font-size:12px;font-weight:500;color:#666;margin:0 0 7px}.change strong{display:block;font-size:15px;font-weight:600;line-height:1.45}.change p{font-size:13px;line-height:1.65;color:#555;margin-top:7px}
.check{font-size:13px;line-height:1.65}.check strong{font-weight:600}.scope{font-size:12px;line-height:1.6;color:#666;margin-top:6px}
footer{display:flex;gap:14px 20px;justify-content:space-between;align-items:baseline;border-top:1px solid #e6e6e6;margin-top:20px;padding-top:14px;font-size:12px}footer details{flex:1;min-width:0}summary{font-size:12px;cursor:pointer;list-style-position:inside;text-decoration:underline;text-underline-offset:3px}a{font-size:12px;color:#333;text-decoration:underline;text-underline-offset:3px;flex:none}a:hover,summary:hover{color:#000}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #39708d;outline-offset:4px}
.details{margin-top:14px;font-size:12px;line-height:1.75;overflow-wrap:anywhere;color:#555}.details p+p{margin-top:9px}.details strong{font-weight:600;color:#333}.footnote{font-size:11px;line-height:1.6;color:var(--muted-foreground,#666);margin:18px 0 0}
::selection{background:#d8e7ed;color:#162e39}
@media(max-width:520px){.card{padding:18px}header{display:block}h2{font-size:20px}.status{display:inline-block;margin-top:12px}.explanation{font-size:14px;margin:18px 0 22px}.change{gap:14px}.change>div+div{padding-left:14px}.change strong{font-size:14px}.change p{font-size:12px}footer{flex-wrap:wrap}}
@media(max-width:350px){.change{grid-template-columns:1fr;gap:18px}.change>div+div{padding-left:0;border:0}}
</style></head><body>
<nav class="controls" aria-label="Investigation state"><button data-state="complete" aria-pressed="true">Completed investigation</button><button data-state="pending" aria-pressed="false">Awaiting approval</button></nav>
<p class="note">B, refined · A plain-language summary above the before-and-after comparison.</p>
<main id="mock"></main>
<p class="footnote">Design mock using recorded synthetic-cell results. The live card is unchanged; “Open investigation” links to the dev demo.</p>
<script>
let state='complete';
function render(){
const done=state==='complete',id=done?'inv_c51194ac2a68ef19':'inv_1b63c1cbdd6c12bd';
document.querySelector('#mock').innerHTML='<article class="card" aria-label="Investigation summary"><header><div><h2>'+(done?'A clearer model of the battery’s response':'The battery’s slower response is still uncertain')+'</h2><p class="identity">Investigation '+(done?'1':'2')+' · Simulated battery</p></div><span class="status '+(done?'':'pending')+'">'+(done?'Complete':'Awaiting approval')+'</span></header>'+
'<p class="explanation">'+(done?'The first test showed how much the battery’s voltage drops right away, but left its slower behavior uncertain. A follow-up test using a sequence of current pulses separated those effects. The updated model then passed a check on measurements it hadn’t been fitted to.':'The first test showed how much the battery’s voltage drops right away, but couldn’t distinguish the two settings that describe its slower response. A follow-up sequence of current pulses has been proposed to separate them. It’s awaiting approval, so we don’t yet know whether it will resolve the uncertainty.')+'</p>'+
'<div class="change"><div><h3>Before · short test</h3><strong>Slow response uncertain</strong><p>The immediate voltage drop was clear, but two settings for the slower response remained uncertain.</p></div><div><h3>'+(done?'After · follow-up test':'Next · proposed test')+'</h3><strong>'+(done?'Slow response resolved':'Try a sequence of pulses')+'</strong><p>'+(done?'The extra measurements let us determine all three model settings.':'Awaiting approval. No follow-up result is recorded yet.')+'</p></div></div>'+
'<p class="check">'+(done?'<strong>Prediction check passed.</strong> Tested against 741 measurements excluded from fitting.':'<strong>Prediction check not yet recorded.</strong> The proposed test has not produced a result.')+'</p><p class="scope">Scope: a simulated cell under the tested conditions.</p>'+
'<footer><details><summary>Technical details &amp; outputs</summary><div class="details">'+(done?'<p><strong>Model:</strong> Fit #2 · R0 0.02494 Ω · R1 0.04513 Ω · C1 1,610 F. All three parameters identified.</p><p><strong>Prediction check:</strong> held-out χ²/N 1.04 across 741 samples; passed the recorded threshold of 2.</p><p><strong>Measurements:</strong> quick_pulse@1 (89 samples), pulse_ladder@1 (2,001 samples), check@1 (741 samples, excluded from fitting).</p><p><strong>Other records:</strong> approved pulse_ladder proposal and validation result.</p>':'<p><strong>Model:</strong> Fit #1 · R0 0.02486 Ω identified; R1 and C1 unresolved.</p><p><strong>Measurements:</strong> quick_pulse@1 and check@1. No held-out validation is recorded.</p><p><strong>Proposal:</strong> pulse_ladder, pending approval. Follow-up measurements are not recorded.</p>')+'<p>Recorded name: quick_pulse start (simulated). Temperature changes and aging remain untested.</p></div></details><a target="_blank" rel="noopener" href="https://dev--autophys.lona.so/app?selection='+id+'#'+id+'">Open investigation</a></footer></article>';
}
document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));render()}));render();
window.auditMock=()=>{const card=document.querySelector('.card');if(document.documentElement.scrollWidth>innerWidth||card.scrollWidth>card.clientWidth)throw Error('Horizontal overflow at '+innerWidth);return {width:innerWidth,state,overflow:false}};
requestAnimationFrame(()=>console.log(JSON.stringify(window.auditMock())));
</script></body></html>
