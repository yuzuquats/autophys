<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigation card variations</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.55 var(--font-sans,system-ui,sans-serif);color:var(--foreground,#202020);background:transparent}
button,select,summary{font:inherit}button,summary{cursor:pointer}button{color:inherit}button:focus-visible,summary:focus-visible{outline:2px solid var(--ring,#39708d);outline-offset:4px}::selection{background:#d8e7ed;color:#162e39}
.controls{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;margin:0 0 10px}.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--secondary,#f0f0f0);border-radius:8px;padding:3px}.seg button{font-size:12px;line-height:1.4;background:none;border:0;border-radius:5px;padding:7px 10px;color:var(--muted-foreground,#606060)}.seg button[aria-pressed=true]{background:var(--card,#fff);color:var(--foreground,#222);box-shadow:0 1px 3px #00000016}.note{font-size:12px;color:var(--muted-foreground,#666);margin:0 0 26px}
.variant{margin:0 0 32px}.variant>header{margin-bottom:12px}.variant h2{font-size:16px;line-height:1.4;font-weight:600;margin:0}.variant>header p{font-size:12px;color:var(--muted-foreground,#666);margin:4px 0 0}.recommended{font-size:11px;font-weight:500;margin-left:8px;color:var(--muted-foreground,#626262)}
.card{background:#fff;color:#252525;border-radius:12px;padding:22px;box-shadow:0 2px 5px #0000000f,0 8px 22px #00000012;min-width:0}.cardhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}.cardhead>div{min-width:0}.card h3{margin:0;font-size:19px;line-height:1.35;letter-spacing:-.018em;font-weight:600;text-wrap:balance}.identity{color:#666;font-size:11px;line-height:1.5;margin:6px 0 0;overflow-wrap:anywhere}.status{font-size:11px;line-height:1.5;flex:none;border-radius:4px;padding:4px 7px;background:#edf4ee;color:#256046}.status.pending{background:#fbf2e5;color:#845019}
.card p{margin:0}.card .identity{margin-top:6px}.lead{font-size:14px;line-height:1.65;margin:18px 0 14px!important;max-width:68ch}.evidence{font-size:12px;color:#555;line-height:1.7;font-variant-numeric:tabular-nums}.evidence strong{font-weight:500;color:#292929}
.footer{margin-top:18px;padding-top:13px;border-top:1px solid #e7e7e7;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 18px;font-size:12px}.footer details{flex:1;min-width:170px}.footer summary{color:#454545;text-decoration:underline;text-underline-offset:3px;list-style-position:inside;font-size:12px}.footer .output-body{font-size:12px;line-height:1.7;color:#555;margin-top:12px;max-width:56ch}.output-body p+p{margin-top:6px}.record{font-size:12px;border:0;padding:0;background:none;text-decoration:underline;text-underline-offset:3px}.record:hover,.footer summary:hover{color:#000}.record-panel{margin-top:14px;background:#f5f5f5;padding:14px;border-radius:8px;font-size:12px;color:#444}.record-panel header{display:flex;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:8px}.record-panel button{border:0;background:none;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:0}.record-panel:focus{outline:2px solid #39708d;outline-offset:3px}
.change{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:22px 0 14px}.change>div+div{border-left:1px solid #e2e2e2;padding-left:24px}.change h4{font-weight:500;font-size:12px;color:#666;margin:0 0 9px}.change strong{display:block;font-size:15px;line-height:1.5;font-weight:600}.change p{font-size:12px;color:#626262;margin-top:4px}
.summary{margin:20px 0 0;display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px 16px;font-size:13px;line-height:1.65}.summary dt{font-size:12px;color:#666}.summary dd{margin:0}.summary dd strong{font-weight:600}
#paper{display:none;background:#fff;color:#252525;border:1px solid var(--border,#e5e5e5);border-radius:12px;padding:28px}.paper-title{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:0 0 28px}.paper-section{font-size:18px;line-height:1.4;font-weight:600;margin:24px 0 12px}.paper-prose{font-size:14px;line-height:1.75;color:#555;max-width:70ch;margin:0 0 22px}#paper .variant{margin-bottom:26px}#paper .variant>header{display:none}.choices{margin:16px 0;display:none}body[data-view=context] #paper,body[data-view=context] .choices{display:block}body[data-view=context] #comparison{display:none}
#paper .variant:not(.selected){display:none}.paper-tail{margin-bottom:0}.footnote{font-size:11px;color:var(--muted-foreground,#666);margin:10px 0 0}
@media(max-width:520px){.card{padding:18px}.cardhead{display:block}.status{display:inline-block;margin-top:10px}.card h3{font-size:18px}.change{gap:14px}.change>div+div{padding-left:14px}.summary{grid-template-columns:56px minmax(0,1fr);gap:12px}.footer{align-items:flex-start}#paper{padding:18px}.paper-title{font-size:21px}.recommended{display:inline-block}.controls{gap:8px}.note{margin-bottom:22px}}
@media(prefers-color-scheme:dark){.card,#paper{background:#fff;color:#252525}}
</style></head>
<body data-view="compare">
<div class="controls">
<div class="seg" aria-label="Investigation state"><button data-state="complete" aria-pressed="true">Completed</button><button data-state="pending" aria-pressed="false">Awaiting approval</button></div>
<div class="seg" aria-label="Presentation"><button data-view="compare" aria-pressed="true">Compare</button><button data-view="context" aria-pressed="false">In Overview</button></div>
</div>
<p class="note">Design concepts using the recorded synthetic-cell results. Each retains the soft std-card shadow.</p>
<div class="choices"><div class="seg" aria-label="Card variation"><button data-choice="a" aria-pressed="true">A · Finding first</button><button data-choice="b" aria-pressed="false">B · Before / after</button><button data-choice="c" aria-pressed="false">C · Research summary</button></div></div>
<main id="comparison"></main>
<main id="paper"><h1 class="paper-title">Identifying a battery’s fast and slow response</h1><h2 class="paper-section" id="context-heading">Findings</h2><p class="paper-prose" id="context-before"></p><div id="context-card"></div><h2 class="paper-section">Takeaways</h2><p class="paper-prose paper-tail" id="context-after"></p></main>
<p class="footnote">Editorial summaries are proposed copy. These mocks do not change the live demo or register new components.</p>
<script>
let state='complete',choice='a';
const names={a:['A · Finding first','The conclusion leads; evidence and grouped outputs support it.'],b:['B · Before / after','Makes the investigation’s contribution visible as a change in knowledge.'],c:['C · Research summary','Separates the work performed, the finding, and the evidence.']};
function status(){return '<span class="status '+(state==='pending'?'pending':'')+'">'+(state==='complete'?'Complete · validated':'Awaiting approval')+'</span>'}
function identity(){return '<p class="identity">Investigation '+(state==='complete'?'1':'2')+' · quick_pulse start (simulated)</p>'}
function header(title){return '<header class="cardhead"><div><h3>'+title+'</h3>'+identity()+'</div>'+status()+'</header>'}
function evidence(){return state==='complete'?'<p class="evidence"><strong>Held-out χ²/N 1.04</strong> · 741 samples · passed threshold 2</p>':'<p class="evidence">Pulse ladder proposed · held-out validation not recorded</p>'}
function outputs(){return '<footer class="footer"><details><summary>'+(state==='complete'?'Outputs · Fit #2, 3 datasets, validation':'Records · Fit #1, 2 datasets, proposal')+'</summary><div class="output-body">'+(state==='complete'?'<p><strong>Fit #2:</strong> R0 0.02494 Ω · R1 0.04513 Ω · C1 1,610 F</p><p><strong>Measurements:</strong> quick_pulse@1 (89) · pulse_ladder@1 (2,001) · check@1 (741, held out)</p><p><strong>Records:</strong> approved pulse_ladder proposal and passed validation.</p>':'<p><strong>Fit #1:</strong> R0 0.02486 Ω identified; R1 and C1 unresolved.</p><p><strong>Datasets:</strong> quick_pulse@1 and check@1. No held-out validation is recorded.</p><p><strong>Proposal:</strong> pulse_ladder, awaiting approval. Follow-up measurements are not recorded.</p>')+'</div></details><button class="record">Open investigation</button></footer>'}
function card(type){
let content='';
if(type==='a')content=header(state==='complete'?'Pulse ladder resolved the slow response':'Slow response remains unresolved')+'<p class="lead">'+(state==='complete'?'R0, R1 and C1 are now identified. The refitted model also predicts measurements excluded from fitting.':'The short pulse identified R0, but could not distinguish R1 from C1. A pulse ladder is proposed to resolve the ambiguity.')+'</p>'+evidence();
if(type==='b')content=header(state==='complete'?'All three parameters are now identified':'R0 identified; R1 and C1 still coupled')+'<div class="change"><div><h4>Short pulse</h4><strong>R0 identified</strong><p>R1 and C1 unresolved</p></div><div><h4>'+(state==='complete'?'After the pulse ladder':'Proposed next step')+'</h4><strong>'+(state==='complete'?'R0, R1, C1 identified':'Pulse ladder')+'</strong><p>'+(state==='complete'?'Ambiguity resolved':'Awaiting approval; no result yet')+'</p></div></div>'+evidence();
if(type==='c')content=header('Battery response investigation')+'<dl class="summary"><dt>Did</dt><dd>'+(state==='complete'?'Fit the short pulse, collect an approved pulse ladder, and refit.':'Fit the short pulse and propose a pulse ladder.')+'</dd><dt>Found</dt><dd><strong>'+(state==='complete'?'R0, R1 and C1 are identified.':'R0 is identified; R1 and C1 remain unresolved.')+'</strong></dd><dt>Checked</dt><dd>'+(state==='complete'?'Held-out χ²/N <strong>1.04</strong> on 741 samples; passed threshold 2.':'Held-out validation not recorded. Proposal awaiting approval.')+'</dd></dl>';
return '<article class="card" data-variant="'+type+'" aria-label="Variation '+type.toUpperCase()+' investigation summary">'+content+outputs()+'</article>';
}
function variant(type){return '<section class="variant '+(type===choice?'selected':'')+'" data-option="'+type+'"><header><h2>'+names[type][0]+(type==='a'?'<span class="recommended">Recommended</span>':'')+'</h2><p>'+names[type][1]+'</p></header>'+card(type)+'</section>'}
function render(){
document.querySelector('#comparison').innerHTML=['a','b','c'].map(variant).join('');
document.querySelector('#context-card').innerHTML=['a','b','c'].map(variant).join('');
document.querySelector('#context-heading').textContent=state==='complete'?'Findings':'Work in progress';
document.querySelector('#context-before').textContent=state==='complete'?'The first investigation began with a short current pulse. It constrained the immediate resistance, R0, while leaving the slower response ambiguous. A human-approved pulse ladder supplied additional measurements.':'A second investigation starts from the same short pulse. Its proposed follow-up experiment is awaiting approval.';
document.querySelector('#context-after').textContent=state==='complete'?'Experiment choice resolved the ambiguity. Parameter identification and prediction on held-out measurements provide separate checks. The result covers this synthetic cell under the tested conditions; temperature and aging remain untested.':'A good fit to the initial curve does not establish R1 and C1. This investigation has not yet repeated the completed result.';
}
document.addEventListener('click',event=>{
const b=event.target.closest('button');if(!b)return;
if(b.dataset.state){state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));render()}
if(b.dataset.view){document.body.dataset.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(e=>{if(e.tagName==='BUTTON')e.setAttribute('aria-pressed',String(e===b))})}
if(b.dataset.choice){choice=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));render()}
if(b.classList.contains('record')){
const card=b.closest('.card'),existing=card.querySelector('.record-panel');if(existing){existing.remove();b.focus();return}
const panel=document.createElement('section');panel.className='record-panel';panel.tabIndex=-1;panel.setAttribute('aria-label','Investigation record preview');panel.innerHTML='<header><strong>Investigation '+(state==='complete'?'1':'2')+' · record preview</strong><button type="button">Close</button></header><p>'+(state==='complete'?'One investigation spans the short pulse and pulse ladder. Fit #2 identifies all free parameters; its held-out validation passed.':'A separate run from the same starting pulse. Fit #1 leaves R1 and C1 unresolved. The pulse ladder proposal remains pending.')+'</p>';panel.querySelector('button').onclick=()=>{panel.remove();b.focus();b.scrollIntoView({block:'nearest'})};card.append(panel);panel.focus();panel.scrollIntoView({block:'nearest'});
}
});render();
window.auditMock=()=>{const overflow=[...document.querySelectorAll('.card,table,.change,.summary')].filter(e=>e.getBoundingClientRect().width&&e.scrollWidth>e.clientWidth+1).map(e=>e.className);const result={width:innerWidth,overflow,pageOverflow:document.documentElement.scrollWidth>innerWidth,variants:document.querySelectorAll('#comparison .card').length};if(result.pageOverflow||overflow.length)throw Error(JSON.stringify(result));return result};
requestAnimationFrame(()=>console.log('Mock layout',window.auditMock()));
</script></body></html>
