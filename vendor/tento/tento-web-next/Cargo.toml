[package]
name = "tento-web-next"
version = "0.1.0"
edition = "2024"
description = "Framework-independent Tento web application routing"

[features]
actix = ["dep:actix-web"]
axum = ["dep:axum"]
ntex = ["dep:ntex"]

[dependencies]
actix-web = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"], optional = true }
ntex = { workspace = true, optional = true }
bytes.workspace = true
cookie = { version = "0.16", features = ["percent-encode"] }
futures-util = "0.3"
http = "1"
mime_guess = "2"
httpdate = "1"
percent-encoding = "2"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
tento-openapi.workspace = true
tento-web-files = { path = "../tento-web-files", default-features = false }
tento-web-router-macros.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
