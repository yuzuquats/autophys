[package]
name = "tento-web-files"
version = "0.1.0"
edition = "2024"

[features]
default = ["actix"]
actix = ["dep:actix", "dep:actix-web", "dep:actix-http", "dep:actix-files", "dep:tento-core", "dep:anyhow", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tracing", "dep:tento-openapi"]

[dependencies]
tento-core = { workspace = true, optional = true }
actix = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }
actix-http = { workspace = true, optional = true }
actix-files = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tento-openapi = { workspace = true, optional = true }
