[package]
name = "tento-env-file-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tento-env.workspace = true
tento-secrets.workspace = true
anyhow.workspace = true
tento-nodes = { workspace = true, optional = true }

[features]
# `transport` adds the materialize helpers that write secrets onto a remote
# host over a `tento_nodes::Transport`. Off by default to keep the core lean.
transport = ["dep:tento-nodes"]

[dev-dependencies]
tempfile = "3"
