[package]
authors = ["James Kao <james.l.kao@gmail.com>"]
categories = ["command-line-interface"]
description = "tento command-language engine: the #[command] calculus, the Lisp host, the run loop, and the .tsh.app bundle layer"
edition = "2024"
keywords = ["shell", "cli", "interactive", "terminal", "lisp"]
license = "MIT"
name = "tento-lisp-cmd"
rust-version = "1.85"
version = "0.1.9"

[dependencies]
tento-env.workspace = true
tento-exception.workspace = true
tento_lisp_macros = { version = "0.1.7", path = "../tento-lisp-macros" }
tento-lisp.workspace = true
tento-term.workspace = true
tento-shapes.workspace = true
tento-tui-complete.workspace = true
string-interner.workspace = true

anyhow.workspace = true
colored = "2.1.0"
ctrlc = "3.4.2"
futures.workspace = true
glob = "0.3.3"
indoc = "2.0.4"

serde = { version = "1.0.218", features = ["derive"] }
serde-reflection = "0.4.0"
serde_json = "1.0.111"
indexmap = "2"
libc.workspace = true
# Grows the evaluation stack on demand (src/script/stack.rs); rustc's own
# answer to deep recursion. Brings `psm`; cc/libc/cfg-if are already locked.
stacker = "0.1"
thiserror = "1.0.56"
uuid = "1.10.0"
tracing = "0.1.41"
tokio = { version = "1.42.0", features = ["full"] }

[dev-dependencies]
tento-env.workspace = true
