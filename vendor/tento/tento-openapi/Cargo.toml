[package]
name = "tento-openapi"
version = "0.1.0"
edition = "2024"
description = "The OpenAPI schema layer tento owns: schema model, ToSchema trait and derive"

# Narrow on purpose: this crate replaces the schema/operation surface tento uses.
# Regression fixtures freeze the legacy 5.5 model without a legacy dependency.

[features]
default = ["chrono", "uuid"]
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]

[dependencies]
tento-openapi-macros.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { workspace = true, features = ["serde"] }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
serde_with.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["serde"] }
