[package]
authors = ["James Kao <james.l.kao@gmail.com>"]
categories = ["command-line-interface"]
description = "Facade re-exporting the tento command engine (tento-lisp-cmd) — being carved"
edition = "2024"
keywords = ["shell", "cli", "interactive", "terminal"]
license = "MIT"
name = "tento-sh"
readme = "README.md"
rust-version = "1.85"
version = "0.1.9"

[dependencies]
tento-lisp-cmd = { version = "0.1.9", path = "../tento-lisp-cmd" }
tento-app = { version = "0.1.0", path = "../tento-app" }

[dev-dependencies]
# The facade's integration tests derive #[command]/CommandArg (the generated
# code uses anyhow/serde_json/futures, re-exported) and are async.
tento-env.workspace = true
anyhow.workspace = true
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.111"
tokio = { version = "1.42.0", features = ["macros", "rt", "rt-multi-thread"] }
