[package]
name = "tento-web"
version = "0.1.0"
edition = "2024"

[dependencies]
tento-core.workspace = true
tento-env.workspace = true

tento-dev.workspace = true
tento-web-auth.workspace = true
tento-logger = { workspace = true, features = ["buckets"] }
tento-web-error.workspace = true
tento-web-router.workspace = true
tento-web-files.workspace = true
tento-web-rate-limit.workspace = true

# `http` = the mountable `/_/ux-test/*` data handlers (crate owns the wire contract).
tento-ux-test = { workspace = true, features = ["http"] }
tento-ssr.workspace = true

actix.workspace = true
actix-web.workspace = true
actix-identity.workspace = true
# Only the cookie store (tento-web-auth) is ever used; no redis backend.
actix-session.workspace = true
actix-service.workspace = true
actix-cors.workspace = true
actix-rt.workspace = true
actix-http.workspace = true
actix-files.workspace = true

serde_json.workspace = true
serde.workspace = true
serde_with.workspace = true

anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true

sha2.workspace = true
hmac.workspace = true
subtle = "2.6.1"
hex = "0.4.3"

# Admin
rand.workspace = true
async-trait.workspace = true


# Routing
percent-encoding = "2.3.1"

# Bundling
#
# TODO: defaults have changed
#       when watching with an updated version, the event handlers are
#       immediately called for all (?) files?
#
# notify = "8.0.0"
# notify-debouncer-mini = "0.6.0"
notify = "6.1.1"
notify-debouncer-mini = "0.4.1"
handlebars = "6.1.0"

# run dev
tokio.workspace = true

# core
fnv = "1.0.7"

# utils
uuid.workspace = true

# error handling
derive_more.workspace = true
base64.workspace = true
futures.workspace = true
rustls.workspace = true
tento-openapi.workspace = true
rustls-pemfile = "2.2.0"
sd-notify = "0.4"

[dev-dependencies]
tempfile = "3.15.0"
